upstream users_svc {
    server users:5001;
}

upstream products_svc {
    server products:5002;
}

upstream orders_svc {
    zone orders_svc 64k;
    resolver 127.0.0.11 valid=10s;
    server orders:5003 resolve;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /users {
        proxy_pass http://users_svc;
    }

    location /products {
        proxy_pass http://products_svc;
    }

    location /orders {
        proxy_pass http://orders_svc;
    }
}
